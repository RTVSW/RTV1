<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — Теневой Контур</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Manrope", system-ui, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 9001;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
            opacity: 0.35;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 9002;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.7) 100%);
        }

        .bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(20, 10, 5, 0.7);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vh;
            padding: 20px;
        }

        .title {
            font-family: "Cinzel", serif;
            font-weight: 600;
            font-size: clamp(26px, 4vw, 44px);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #f0e6d8;
            text-align: center;
            padding: 20px 50px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(74, 45, 35, 0.98), rgba(45, 28, 22, 1));
            border: 1px solid rgba(140, 95, 70, 0.4);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
        }

        .menu-btn {
            display: block;
            text-align: center;
            padding: 24px 40px;
            font-family: "Cinzel", serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #f0e6d8;
            text-decoration: none;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(74, 45, 35, 0.92), rgba(55, 34, 26, 0.95));
            border: 1px solid rgba(140, 95, 70, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .menu-btn:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(145deg, rgba(94, 60, 45, 0.98), rgba(70, 44, 34, 0.98));
            box-shadow: 0 14px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
            border-color: rgba(160, 110, 80, 0.55);
        }

        .menu-btn.game {
            background: linear-gradient(145deg, rgba(90, 60, 30, 0.95), rgba(60, 38, 18, 0.98));
            border-color: rgba(180, 140, 80, 0.45);
        }

        .menu-btn.game:hover {
            background: linear-gradient(145deg, rgba(115, 78, 40, 1), rgba(78, 50, 24, 1));
            border-color: rgba(220, 180, 100, 0.7);
            box-shadow: 0 14px 32px rgba(0,0,0,0.55), 0 0 24px rgba(220, 180, 100, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .back-btn {
            font-family: "Manrope", sans-serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.04em;
            color: #f0e6d8;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(74, 45, 35, 0.92), rgba(55, 34, 26, 0.95));
            border: 1px solid rgba(140, 95, 70, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(145deg, rgba(94, 60, 45, 0.98), rgba(70, 44, 34, 0.98));
        }

        .signature {
            position: fixed;
            bottom: 18px;
            left: 22px;
            z-index: 9100;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(120, 90, 75, 0.7);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .page {
                gap: 3vh;
                padding: 15px;
            }

            .title {
                font-size: 22px;
                padding: 16px 30px;
                letter-spacing: 0.1em;
            }

            .menu {
                gap: 14px;
            }

            .menu-btn {
                padding: 18px 28px;
                font-size: 15px;
                letter-spacing: 0.08em;
            }

            .back-btn {
                padding: 12px 28px;
                font-size: 14px;
            }

            .signature {
                bottom: 12px;
                left: 14px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <img src="Фон.png" alt="Фон" class="bg">
    <div class="overlay"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="page">
        <h1 class="title">Портфолио</h1>

        <div class="menu">
            <a href="portfolio-logos.html" class="menu-btn">Логотипы</a>
            <a href="portfolio-presentations.html" class="menu-btn">Презентации</a>
            <a href="portfolio-print.html" class="menu-btn">Полиграфия</a>
            <a href="chess.html" class="menu-btn game">Шахматы</a>
        </div>

        <a href="index.html" class="back-btn">← Назад</a>
    </div>

    <div class="signature">ReedGnir</div>
</body>
</html>
