<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Теневой Контур</title>
    <meta name="description" content="Закрытое оперативное соединение. Мост между бойцом и задачей.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #5c3a2e;
            --text: #f0e6d8;
            --shadow: rgba(0, 0, 0, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: "Manrope", system-ui, -apple-system, sans-serif;
            background: #000;
            color: var(--text);
            overflow-x: hidden;
            cursor: crosshair;
            transition: transform 0.05s linear;
        }

        body.shake {
            animation: shake 0.28s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, -1px); }
            80% { transform: translate(2px, 1px); }
        }

        #preloader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #preloader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #preloader img {
            max-width: 180px;
            max-height: 180px;
            opacity: 0.7;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.96); }
            50% { opacity: 0.85; transform: scale(1); }
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 9001;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
            opacity: 0.35;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 9002;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.7) 100%);
        }

        .section-main {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .section-main::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .gerb {
            position: relative;
            z-index: 3;
            max-width: 48%;
            max-height: 58vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: drop-shadow(0 0 25px rgba(92, 58, 46, 0.35));
            animation: fadeInScale 1.4s ease forwards 0.6s;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .gerb:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 35px rgba(92, 58, 46, 0.55));
        }

        .section-buttons {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            padding: 40px 20px;
        }

        .title {
            position: relative;
            z-index: 3;
            font-family: "Cinzel", serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 52px);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text);
            text-align: center;
            padding: 20px 48px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(74, 45, 35, 0.92), rgba(55, 34, 26, 0.95));
            border: 1px solid rgba(140, 95, 70, 0.3);
            box-shadow: 
                0 8px 24px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards 0.9s;
            transition: all 0.3s ease;
        }

        .title:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(145deg, rgba(94, 60, 45, 0.98), rgba(70, 44, 34, 0.98));
            box-shadow: 
                0 14px 32px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.12);
            border-color: rgba(160, 110, 80, 0.45);
        }

        .about {
            position: relative;
            z-index: 3;
            max-width: 780px;
            color: var(--text);
            font-size: 20px;
            line-height: 1.75;
            text-align: center;
            background: rgba(48, 30, 24, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 36px 44px;
            border-radius: 18px;
            border: 1px solid rgba(120, 80, 60, 0.25);
            box-shadow: 0 12px 40px var(--shadow);
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInUp 1s ease forwards 1.15s;
        }

        .about p {
            margin-bottom: 14px;
        }

        .about p:last-child {
            margin-bottom: 0;
            opacity: 0.9;
            font-size: 0.95em;
        }

        .buttons {
            position: relative;
            z-index: 3;
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInUp 1s ease forwards 1.4s;
        }

        .btn {
            display: inline-block;
            padding: 22px 48px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text);
            text-decoration: none;
            border-radius: 14px;
            text-align: center;
            background: linear-gradient(145deg, rgba(74, 45, 35, 0.92), rgba(55, 34, 26, 0.95));
            border: 1px solid rgba(140, 95, 70, 0.3);
            box-shadow: 
                0 8px 24px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.04);
            background: linear-gradient(145deg, rgba(94, 60, 45, 0.98), rgba(70, 44, 34, 0.98));
            box-shadow: 
                0 14px 32px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.12);
            border-color: rgba(160, 110, 80, 0.45);
        }

        .btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .signature {
            position: fixed;
            bottom: 18px;
            left: 22px;
            z-index: 9100;
            font-family: "Manrope", sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(80, 55, 45, 0.55);
            pointer-events: none;
        }

        #crackCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 9500;
            pointer-events: none;
        }

        @keyframes fadeInScale {
            to {
                opacity: 0.85;
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .section-main {
                height: 100svh;
            }

            .gerb {
                max-width: 72%;
                max-height: 38vh;
            }

            .section-buttons {
                padding: 6vh 18px 10vh;
                gap: 28px;
            }

            .title {
                font-size: clamp(22px, 6.5vw, 34px);
                letter-spacing: 0.12em;
                padding: 16px 28px;
            }

            .about {
                font-size: 15.5px;
                padding: 26px 22px;
                max-width: 94%;
                line-height: 1.65;
            }

            .buttons {
                flex-direction: column;
                gap: 16px;
                width: 100%;
            }

            .btn {
                width: 100%;
                max-width: 320px;
                padding: 18px 28px;
                font-size: 16px;
            }

            .signature {
                bottom: 12px;
                left: 14px;
                font-size: 11px;
            }
        }

        @media (max-width: 400px) {
            .about {
                font-size: 14.5px;
                padding: 22px 18px;
            }

            .btn {
                font-size: 15px;
                padding: 16px 24px;
            }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <img src="Герб.png" alt="">
    </div>

    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="section-main">
        <img src="Фон.png" alt="Фон" class="bg" data-speed="0.03">
        <img src="Герб.png" alt="Герб" class="gerb">
    </div>

    <div class="section-buttons">
        <img src="Фон.png" alt="Фон" class="bg" data-speed="0.03">
        <h1 class="title">Теневой Контур</h1>

        <div class="about">
            <p>Закрытое оперативное соединение.</p>
            <p>Мы не биржа. Мы не агентство. Мы — мост между бойцом и задачей, минуя хаос открытого рынка.</p>
            <p>Вход закрыт. Связь только через Координатора.</p>
        </div>

        <div class="buttons">
            <a href="https://t.me/ReedGnir" target="_blank" class="btn">Вступить в команду</a>
            <a href="portfolio.html" class="btn">Портфолио</a>
            <a href="price.html" class="btn">Заказать услугу</a>
        </div>
    </div>

    <div class="signature">ReedGnir</div>

    <canvas id="crackCanvas"></canvas>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hide');
            }, 900);
        });

        document.addEventListener('contextmenu', e => e.preventDefault());

        const bgs = document.querySelectorAll('.bg');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / window.innerWidth;
            const y = (e.clientY - window.innerHeight / 2) / window.innerHeight;
            bgs.forEach(bg => {
                const speed = parseFloat(bg.dataset.speed) || 0.03;
                bg.style.transform = `translate(${x * speed * 100}px, ${y * speed * 100}px) scale(1.05)`;
            });
        });

        const canvas = document.getElementById('crackCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const cracks = [];

        function createCrack(x, y) {
            const count = 6 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const baseAngle = (Math.PI * 2 * i) / count;
                const angle = baseAngle + (Math.random() - 0.5) * 0.35;
                cracks.push({
                    x, y,
                    angle,
                    length: 0,
                    maxLength: 90 + Math.random() * 160,
                    width: 1.1 + Math.random() * 1.4,
                    speed: 11 + Math.random() * 9,
                    points: null,
                    alpha: 1
                });
            }
        }

        function buildPoints(crack) {
            const pts = [{ x: crack.x, y: crack.y }];
            let cx = crack.x;
            let cy = crack.y;
            let ang = crack.angle;
            const steps = 9 + Math.floor(Math.random() * 6);
            const step = crack.maxLength / steps;

            for (let i = 0; i < steps; i++) {
                if (i > 0 && Math.random() < 0.55) {
                    ang += (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.7);
                } else {
                    ang += (Math.random() - 0.5) * 0.25;
                }

                const len = step * (0.75 + Math.random() * 0.5);
                cx += Math.cos(ang) * len;
                cy += Math.sin(ang) * len;
                pts.push({ x: cx, y: cy });

                if (Math.random() < 0.3 && i > 1) {
                    const bAng = ang + (Math.random() > 0.5 ? 0.9 : -0.9) * (0.7 + Math.random() * 0.5);
                    const bLen = len * (0.35 + Math.random() * 0.4);
                    pts.push({
                        x: cx + Math.cos(bAng) * bLen,
                        y: cy + Math.sin(bAng) * bLen,
                        branch: true,
                        fromX: cx,
                        fromY: cy
                    });
                    pts.push({ x: cx, y: cy });
                }
            }
            return pts;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = cracks.length - 1; i >= 0; i--) {
                const c = cracks[i];
                if (!c.points) c.points = buildPoints(c);

                c.length += c.speed;
                const progress = Math.min(c.length / c.maxLength, 1);
                if (progress >= 1) c.alpha -= 0.012;

                ctx.lineCap = 'butt';
                ctx.lineJoin = 'miter';
                ctx.shadowColor = 'rgba(255,255,255,0.12)';
                ctx.shadowBlur = 1.5;

                const visibleCount = Math.floor((c.points.length - 1) * progress);

                ctx.beginPath();
                ctx.strokeStyle = `rgba(230, 225, 215, ${c.alpha * 0.9})`;
                ctx.lineWidth = c.width;

                let started = false;
                for (let p = 0; p <= visibleCount; p++) {
                    const pt = c.points[p];
                    if (pt.branch) {
                        ctx.moveTo(pt.fromX, pt.fromY);
                        ctx.lineTo(pt.x, pt.y);
                    } else {
                        if (!started) {
                            ctx.moveTo(pt.x, pt.y);
                            started = true;
                        } else {
                            ctx.lineTo(pt.x, pt.y);
                        }
                    }
                }
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 255, 255, ${c.alpha * 0.35})`;
                ctx.lineWidth = c.width * 0.35;
                started = false;
                for (let p = 0; p <= visibleCount; p++) {
                    const pt = c.points[p];
                    if (pt.branch) {
                        ctx.moveTo(pt.fromX, pt.fromY);
                        ctx.lineTo(pt.x, pt.y);
                    } else {
                        if (!started) {
                            ctx.moveTo(pt.x, pt.y);
                            started = true;
                        } else {
                            ctx.lineTo(pt.x, pt.y);
                        }
                    }
                }
                ctx.stroke();

                if (c.alpha <= 0) cracks.splice(i, 1);
            }

            requestAnimationFrame(draw);
        }
        draw();

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                createCrack(e.clientX, e.clientY);
                document.body.classList.remove('shake');
                void document.body.offsetWidth;
                document.body.classList.add('shake');
            }
        });
    </script>

</body>
</html>
